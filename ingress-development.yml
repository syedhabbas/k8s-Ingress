# In this file we will define Ingress for production...!
#

kind: Ingress
apiVersion: networking.k8s.io/v1

metadata:
  name: dev-ingress
  namespace:  development
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /dev
        backend:
          service:
            name: dev-service
            port:
              number: 80
