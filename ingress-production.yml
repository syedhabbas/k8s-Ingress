# In this file we will define Ingress for production...!
#

kind: Ingress
apiVersion: networking.k8s.io/v1

metadata:
  name: prod-ingress
  namespace:  production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /prod
        backend:
          service:
            name: prod-service
            port: 
              number: 80
      

