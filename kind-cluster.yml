# In this file we will write yml file to create KIND Cluster...!


kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kanosh

nodes:
- role: control-plane
  image:  kindest/node:v1.37.0
- role: worker
  image:  kindest/node:v1.37.0
- role: worker
  image:  kindest/node:v1.37.0
- role: worker
  image:  kindest/node:v1.37.0
  
  extraPortMappings:
  - hostPort: 80
    containerPort:  80
    protocol: TCP

